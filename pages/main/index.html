<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg">
  <link rel="stylesheet" href="../../normalize.css">
  <link rel="stylesheet" href="./style.css">
  <title>SpartsPro</title>
</head>
<body>
  <div class="container">
    <header class="header">
      <nav class="nav">
        <a href="#">
          <div class="logo">
            <img src="../../assets/images/logo.svg" alt="logo" class="logo" />
          </div>
        </a>
        <ul class="menu-list">
          <li class="menu-list__item"><a href="#">главная</a></li>
          <li class="menu-list__item"><a href="#">каталог</a></li>
          <li class="menu-list__item"><a href="#">о компании</a></li>
          <li class="menu-list__item"><a href="#">оплата и доставка</a></li>
          <li class="menu-list__item"><a href="#">контакты</a></li>
        </ul>
      </nav>
    </header>
    <section class="catalog">
      <h2 class="catalog__title">рекомендуемое оборудование</h2>
      <ul class="catalog-list">
        <li class="catalog-list__item">
          <img class="item-img" src="../../assets/images/cards/card_1.svg" alt="elevator rope" />
          <div class="item-content">
            <span class="item-title">Стальной канат для лифта GRS 9X21F(9Х17)-IWRC 1570</span>
            <div class="instock">
              <img class="instock-img" src="../../assets/images/instock.svg" alt="instock" />
              <span class="instock-txt" >В наличии 50 м.</span>
            </div>
            <button class="item-btn">Подробнее</button>
          </div>
        </li>
      </ul>
    </section>
  </div>

</html>
